<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clínica Boreal</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #edf1f2;
    color: #263238;
    font-family: Arial, Helvetica, sans-serif;
}


/* CABECERA */

header {
    background: #ffffff;
    border-bottom: 1px solid #c9d2d5;
    padding: 24px 30px;

    display: flex;
    align-items: center;
}

.logo {
    width: 52px;
    height: 52px;

    border: 2px solid #47727a;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 15px;

    font-size: 23px;

    color: #47727a;
}

header h1 {
    margin: 0;

    font-size: 23px;

    letter-spacing: 2px;

    color: #315b63;
}

header p {
    margin: 5px 0 0;

    font-size: 10px;

    letter-spacing: 1.5px;

    color: #7a888c;
}


/* CONTENEDOR */

.contenedor {

    width: 92%;

    max-width: 850px;

    margin: 45px auto;

}


/* PANEL */

.panel {

    background: white;

    border: 1px solid #cbd3d5;

    box-shadow: 0 5px 18px rgba(0,0,0,0.08);

    padding: 35px;

}


/* TITULO */

.titulo {

    border-bottom: 1px solid #d4dcde;

    padding-bottom: 20px;

    margin-bottom: 25px;

}

.titulo h2 {

    margin: 0;

    font-size: 18px;

    color: #315b63;

}

.titulo p {

    margin-top: 7px;

    font-size: 11px;

    color: #788589;

    line-height: 1.5;

}


/* ACCESO */

.acceso {

    max-width: 480px;

    margin: 0 auto;

}

label {

    display: block;

    margin-top: 18px;

    margin-bottom: 7px;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 1px;

    color: #526368;

}

input {

    width: 100%;

    padding: 14px;

    border: 1px solid #b8c4c7;

    background: #fafcfc;

    font-size: 15px;

    outline: none;

}

input:focus {

    border-color: #47727a;

}


/* BOTON */

button {

    width: 100%;

    margin-top: 20px;

    padding: 14px;

    border: none;

    background: #47727a;

    color: white;

    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

}

button:hover {

    background: #315b63;

}


/* RESULTADO */

#resultado {

    margin-top: 25px;

    display: none;

}

.exito {

    padding: 20px;

    border: 1px solid #9db7aa;

    background: #eef6f1;

}

.exito strong {

    display: block;

    margin-bottom: 10px;

    color: #37634d;

}

.error {

    padding: 18px;

    border: 1px solid #c8a3a3;

    background: #f7eeee;

    color: #7a3535;

    font-size: 11px;

}


/* DOCUMENTO */

.documento {

    margin-top: 20px;

    padding-top: 20px;

    border-top: 1px solid #cdd5d7;

}

.documento h3 {

    font-size: 14px;

    margin: 0 0 8px;

}

.documento p {

    font-size: 11px;

    color: #687579;

}


/* BOTON DOCUMENTO */

.boton-documento {

    display: block;

    margin-top: 15px;

    padding: 13px;

    background: #315b63;

    color: white;

    text-align: center;

    text-decoration: none;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 1px;

}


/* PIE */

footer {

    text-align: center;

    margin: 25px;

    font-size: 9px;

    color: #879195;

    letter-spacing: 1px;

}


@media (max-width: 600px) {

    header {

        padding: 20px;

    }

    header h1 {

        font-size: 18px;

    }

    .contenedor {

        margin-top: 25px;

    }

    .panel {

        padding: 22px;

    }

}

</style>

</head>



<body>


<header>

    <div class="logo">
        ❄
    </div>

    <div>

        <h1>
            CLÍNICA BOREAL
        </h1>

        <p>
            SISTEMA DE DOCUMENTACIÓN CLÍNICA
        </p>

    </div>

</header>



<div class="contenedor">


    <div class="panel">


        <div class="titulo">

            <h2>
                NUBE DE DOCUMENTACIÓN CLÍNICA
            </h2>

            <p>

                Acceso al sistema de almacenamiento
                y consulta de documentación clínica.

                Introduzca sus credenciales para continuar.

            </p>

        </div>



        <div class="acceso">


            <label for="usuario">

                USUARIO

            </label>

            <input
                id="usuario"
                type="text"
                autocomplete="off"
            >


            <label for="password">

                CONTRASEÑA

            </label>

            <input
                id="password"
                type="password"
                autocomplete="off"
            >


            <button onclick="acceder()">

                ACCEDER A LA DOCUMENTACIÓN

            </button>


            <div id="resultado"></div>


        </div>


    </div>


</div>



<footer>

    CLÍNICA BOREAL · SISTEMA PRIVADO DE DOCUMENTACIÓN

</footer>



<script>


function acceder() {


    const usuario =
        document.getElementById("usuario").value.trim();


    const password =
        document.getElementById("password").value.trim();


    const resultado =
        document.getElementById("resultado");


    resultado.style.display = "block";


    /*
    ==========================================
    CREDENCIALES PROVISIONALES
    ==========================================
    */

    if (
        usuario === "investigador"
        &&
        password === "1234"
    ) {


        resultado.innerHTML = `

            <div class="exito">

                <strong>
                    ✓ ACCESO AUTORIZADO
                </strong>

                Credenciales verificadas.

                <div class="documento">

                    <h3>
                        DOCUMENTACIÓN DISPONIBLE
                    </h3>

                    <p>
                        Documentación clínica asociada
                        al expediente autorizado.
                    </p>

                    <a
                        class="boton-documento"
                        href="#"
                    >
                        🫀 CONSULTAR PRUEBA DE ESFUERZO
                    </a>

                </div>

            </div>

        `;

    }


    else {


        resultado.innerHTML = `

            <div class="error">

                <strong>
                    ACCESO DENEGADO
                </strong>

                <br><br>

                Las credenciales introducidas
                no son válidas.

            </div>

        `;

    }


}

</script>


</body>

</html>
